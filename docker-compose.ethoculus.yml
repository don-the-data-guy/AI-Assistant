name: ethoculus

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ethoculus-ollama
    ports:
      - "11434:11434"
    volumes:
      - ethoculus-ollama-data:/root/.ollama
    restart: unless-stopped

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: ethoculus-webui
    depends_on:
      - ollama
    ports:
      - "3000:8080"
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      WEBUI_SECRET_KEY: ethoculus-change-this-secret-key
    volumes:
      - ethoculus-open-webui-data:/app/backend/data
    restart: unless-stopped

volumes:
  ethoculus-ollama-data:
  ethoculus-open-webui-data:
